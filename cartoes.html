<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Cartões</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="auth.js"></script>
</head>

<body>
    <canvas id="bg-canvas"></canvas>

    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-section">
                <div
                    style="width: 46px; min-width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;">
                    <img src="logo.webp" alt="Logo"
                        style="width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 10px rgba(124, 107, 255, 0.5));">
                </div>
                <span class="logo-text">Performance</span>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <div class="icon-wrapper"><i data-lucide="bar-chart-3"></i></div>
                    <span class="nav-text">Financeiro</span>
                </a>
                <a href="cartoes.html" class="nav-item active">
                    <div class="icon-wrapper"><i data-lucide="credit-card"></i></div>
                    <span class="nav-text">Cartões</span>
                </a>
                <a href="metas.html" class="nav-item">
                    <div class="icon-wrapper"><i data-lucide="goal"></i></div>
                    <span class="nav-text">Metas</span>
                </a>
                <a href="investimentos.html" class="nav-item">
                    <div class="icon-wrapper"><i data-lucide="landmark"></i></div>
                    <span class="nav-text">Investimentos</span>
                </a>
                <a href="cadastro.html" class="nav-item">
                    <div class="icon-wrapper"><i data-lucide="file-plus"></i></div>
                    <span class="nav-text">Cadastro</span>
                </a>
                <a href="dados.html" class="nav-item">
                    <div class="icon-wrapper"><i data-lucide="database"></i></div>
                    <span class="nav-text">Meus Dados</span>
                </a>
            </nav>
            
            <div class="sidebar-bottom" style="margin-top: auto; padding: 20px 16px 0; border-top: 1px solid rgba(255,255,255,0.05); overflow:hidden;">
                <a href="#" class="nav-item" onclick="localStorage.removeItem('auth_token'); window.location.href='login.html';" style="color: #ff5555;">
                    <div class="icon-wrapper" style="background: rgba(255,85,85,0.1);"><i data-lucide="log-out" style="color: #ff5555;"></i></div>
                    <span class="nav-text">Sair / Contas</span>
                </a>
            </div>
        </aside>

        <main class="main-wrapper">
            <header class="top-header">
                <div class="header-left">
                    <h1>Dashboard <span class="header-divider">|</span> <span class="header-subtitle">Cartões</span>
                    </h1>
                </div>
                <div class="header-right">
                    <span class="user-name">Usuário</span>
                    <div class="user-avatar">
                        <img src="https://ui-avatars.com/api/?name=Rodrigo&background=2B2B2B&color=fff&rounded=true&bold=true"
                            alt="Rodrigo">
                    </div>
                </div>
            </header>

            <div class="content-scroll dash-layout">
                <!-- Mastercards Gerados Dinamicamente pelo dashboard.js -->
                <div class="mc-row" id="mc-cards-container">
                    <!-- Cards são injetados aqui via script de config -->
                </div>

                <div class="chart-row-2">
                    <!-- Gráfico Evolução -->
                    <div class="chart-card glass-card" style="width:100%;">
                        <div class="chart-head">
                            <h3>Despesas de Cartão no Tempo</h3>
                            <div class="chart-filters" data-target="cartao-evo">
                                <button class="fbtn active" data-f="dia">Dia</button>
                                <button class="fbtn" data-f="semana">Sem</button>
                                <button class="fbtn" data-f="mes">Mês</button>
                                <button class="fbtn" data-f="ano">Ano</button>
                            </div>
                        </div>
                        <div id="chart-cartao-evo" style="width:100%;height:350px;"></div>
                    </div>

                    <!-- Top 15 Compras à Vista -->
                    <div class="chart-card glass-card" style="width:100%;">
                        <div class="chart-head">
                            <h3 style="font-weight:600;font-size:1.1rem;">Top 15 Compras à Vista</h3>
                            <div class="chart-filters" id="btn-group-top15">
                                <button class="fbtn" data-f="dia">Dia</button>
                                <button class="fbtn" data-f="semana">Sem</button>
                                <button class="fbtn active" data-f="mes">Mês</button>
                                <button class="fbtn" data-f="ano">Ano</button>
                                <button class="fbtn" data-f="total">Total</button>
                            </div>
                        </div>
                        <div id="chart-top15-faturas" style="width:100%; height:350px;"></div>
                    </div>
                </div>

                <!-- Gestor Inteligente de Parcelas -->
                <div class="chart-row-1" style="margin-top: 24px; padding-bottom:40px;">
                    <div class="chart-card glass-card" style="width: 100%;">
                        <div class="chart-head" style="margin-bottom: 20px;">
                            <div style="display:flex; align-items:center; gap: 10px;">
                                <h3
                                    style="font-size: 1.25rem; color: #00E5FF; font-weight:800; letter-spacing: -0.5px;">
                                    Painel de Gestão de Parcelamentos</h3>
                                <div id="parcelas-insight-wrapper" style="position:relative; z-index:9000;"></div>
                            </div>
                            <div class="chart-filters" id="btn-group-parcelas" style="background: rgba(0,0,0,0.2);">
                                <button class="fbtn active" data-f="month">Neste Mês</button>
                                <button class="fbtn" data-f="pending">Em Aberto</button>
                                <button class="fbtn" data-f="paid">Quitadas</button>
                                <button class="fbtn" data-f="all">Totais</button>
                            </div>
                        </div>
                        <div id="parcelas-list-container"
                            style="display:flex; flex-direction:column; gap:12px; max-height: 480px; overflow-y:auto; padding-right:12px;">
                            <!-- Injeção de componentes HTML elaborados p/ Parcelas via dashboard.js -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script src="dashboard.js"></script>
    <script src="ai-insight.js"></script>
</body>

</html>
